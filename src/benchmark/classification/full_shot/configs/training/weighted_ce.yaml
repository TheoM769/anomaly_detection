training:
  dataset_name: mvtec_anomaly_detection
  classname: ["screw"]
  dist_adjust: False
  multiclass: False
  train_split: 0.8
  num_epochs: 30
  batch_size: 16
  weight_decay: 0.0
  horizontal_flip: 0
  vertical_flip: 0
  rotation: [0, 0]
  brightness: 0
  contrast: 0
  saturation: 0
  hue: 0
  lr: [0.001, 0.00001]
  loss_weights: [1.0, 5.0]
  criterion: "CE"
